plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url 'https://maven.wispforest.io/releases' }
	maven { url 'https://jitpack.io/' }
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	accessWidenerPath = file("src/main/resources/nostalgia.accesswidener")

	mods {
		"nostalgia" {
			sourceSet sourceSets.main
		}
	}

	runs {
		datagen {
			server()
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=nostalgia"
			// was hardcoded to 26.1.1
			vmArg "-Dfabric.addGameVersion=${project.minecraft_version}"
			ideConfigGenerated = true
			runDir "build/datagen"
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += [
					'src/main/generated'
			]
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.11 IS obfuscated, so mappings are required (26.1.x did not need them).
	// Sources use Mojang (Mojmap) names, so use official Mojang mappings.
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Sodium from Modrinth instead of a hardcoded local Windows path.
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"

	// SHA (Sodium Hologram API): build the ported SHA-1.21.11 project and copy its
	// jar into ./libs/. Guarded so the build still configures when it is absent.
	def shaJar = file(project.sha_jar)
	if (shaJar.exists()) {
		modImplementation files(shaJar)
	} else {
		logger.warn("SHA jar not found at ${shaJar} - build SHA-1.21.11 first and copy the jar there.")
	}

	// --- Punchy (first-person animations) --------------------------------
	// Compile-only: Nostalgia mixes into punchy.client.* to make the charged
	// amethyst animate like a trident. Punchy is NOT embedded and NOT required
	// at runtime - it is a soft, optional integration.
	//
	// Drop the Punchy jar into ./libs/. ANY name matching punchy*.jar is picked
	// up, so there is no need to rename the download; if several are present the
	// last by name wins. Override with -Ppunchy_jar=/path/to.jar
	def punchyJar = null
	if (project.hasProperty('punchy_jar')) {
		punchyJar = file(project.property('punchy_jar'))
	} else {
		def punchyCandidates = fileTree(dir: 'libs',
				includes: ['punchy*.jar'],
				excludes: ['*-sources.jar', '*-dev.jar', '*-sources-dev.jar']
		).files.sort { it.name }
		if (!punchyCandidates.isEmpty()) {
			punchyJar = punchyCandidates.last()
		}
	}

	if (punchyJar != null && punchyJar.exists()) {
		logger.lifecycle("Punchy library found: ${punchyJar} - compiling punchy mixins against it.")
		modCompileOnly files(punchyJar)
	} else {
		logger.warn("No libs/punchy*.jar found - the punchy.client.* mixins will NOT compile.")
	}

	// --- Zemlya (gravity library) ---------------------------------------
	// Zemlya is a LIBRARY mod that Nostalgia depends on. It is not shipped
	// separately: it is embedded into the Nostalgia jar via jar-in-jar, so
	// users only install one file.
	//
	// Build Crown91/Zemlya-1.21.11 and copy build/libs/zemlya-<ver>.jar into
	// ./libs/. ANY name matching zemlya*.jar is picked up, so there is no need
	// to rename the file; if several are present the last by name wins.
	// You can also point at an explicit file with -Pzemlya_jar=/path/to.jar
	//
	// Use the remapped release jar, NOT the -dev / -sources one.
	def zemlyaJar = null
	if (project.hasProperty('zemlya_jar')) {
		zemlyaJar = file(project.property('zemlya_jar'))
	} else {
		def candidates = fileTree(dir: 'libs',
				includes: ['zemlya*.jar'],
				excludes: ['*-sources.jar', '*-dev.jar', '*-sources-dev.jar']
		).files.sort { it.name }
		if (!candidates.isEmpty()) {
			zemlyaJar = candidates.last()
		}
	}

	if (zemlyaJar != null && zemlyaJar.exists()) {
		logger.lifecycle("Zemlya library found: ${zemlyaJar} - it will be embedded via jar-in-jar.")
		modImplementation files(zemlyaJar)
		// jar-in-jar: nests the Zemlya jar inside the produced Nostalgia jar
		include files(zemlyaJar)
	} else {
		logger.warn("No libs/zemlya*.jar found - Zemlya will NOT be embedded. " +
				"Build Crown91/Zemlya-1.21.11 and copy its jar into libs/.")
		// Local dev fallback: compile against a sibling Zemlya checkout.
		def zemlyaMain = file("../Zemlya/build/classes/java/main")
		def zemlyaClient = file("../Zemlya/build/classes/java/client")
		if (zemlyaMain.exists()) {
			compileOnly files(zemlyaMain)
		}
		if (zemlyaClient.exists()) {
			compileOnly files(zemlyaClient)
		}
	}
}

processResources {
	inputs.property "version", project.version
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	exclude "**/* *.ogg"
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.21.11 itself only needs Java 21, BUT the bundled SHA library
	// bridges to the native Rapier physics engine through the final java.lang.foreign
	// (FFM) API, which is non-preview only from Java 22 on. Its class files are
	// major version 66, so the whole mod is built and shipped for Java 22+.
	it.options.release = 22

	// During the 26.1.2 -> 1.21.11 port the compiler hits javac's default cap of
	// 100 reported errors, which hides the real total and makes progress
	// impossible to measure. Report everything instead.
	it.options.compilerArgs << "-Xmaxerrs" << "10000"
	it.options.compilerArgs << "-Xmaxwarns" << "10000"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_22
	targetCompatibility = JavaVersion.VERSION_22
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}

// The old 'deploy' task copied jars into hardcoded PrismLauncher paths and was
// wired into 'build'. Now it is opt-in: ./gradlew build deploy -PmodsDir=...
tasks.register('deploy', Copy) {
	onlyIf { project.hasProperty('modsDir') }
	from(layout.buildDirectory.dir("libs"))
	include("*.jar")
	exclude("*-sources.jar", "*-dev.jar", "*-sources-dev.jar")
	into(project.findProperty('modsDir') ?: layout.buildDirectory.dir("deploy"))
}
