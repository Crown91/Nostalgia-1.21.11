# Builds Nostalgia (Alpha Protocol) on GitHub's servers.
# Requires libs/sha-1.0.7.jar to be committed into this repo (build it from the
# SHA-1.21.11 project first, or download it from that repo's build artifacts).

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: warn if SHA jar is missing
        run: |
          if [ ! -f libs/sha-1.0.7.jar ]; then
            echo "::warning::libs/sha-1.0.7.jar not found - anything depending on SHA will fail to compile."
          fi

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build-console.log

      # Always upload, so a failed build still gives you the full log to share.
      - name: capture build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/reports/
            build-console.log
            **/*.log
          if-no-files-found: ignore

      - name: capture jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nostalgia-jar
          path: build/libs/
