name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      # Minecraft 1.21.11 itself runs on Java 21, but the bundled SHA library
      # bridges to the native Rapier physics engine through the final FFM API,
      # which is non-preview only from Java 22 on (its classes are major 66).
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Report bundled libraries
        run: |
          echo "--- contents of libs/ ---"
          ls -la libs/ 2>/dev/null || echo "libs/ directory does not exist"
          # any zemlya*.jar counts; build.gradle picks it up by glob
          if ! ls libs/zemlya*.jar >/dev/null 2>&1; then
            echo "::warning::no libs/zemlya*.jar found - Zemlya will NOT be embedded into the produced jar."
          else
            echo "Zemlya library present: $(ls libs/zemlya*.jar)"
          fi
          if ! ls libs/sha*.jar >/dev/null 2>&1; then
            echo "::warning::no libs/sha*.jar found - SHA API will not resolve."
          else
            echo "SHA library present: $(ls libs/sha*.jar)"
          fi

      - name: Restore Gradle wrapper if missing
        id: wrapper
        timeout-minutes: 10
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing -> regenerating it"
            gradle wrapper --gradle-version 9.4.1 --distribution-type bin
            echo "regenerated=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle-wrapper.jar present"
          fi
          chmod +x gradlew

      - name: Commit restored wrapper
        if: steps.wrapper.outputs.regenerated == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x gradlew || true
          git add -A gradle/wrapper gradlew gradlew.bat
          git commit -m "ci: restore Gradle wrapper (gradle-wrapper.jar)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Build
        id: build
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --info --no-daemon 2>&1 | tee build.log

      # Runs again on purpose, as its own step: 'build' already invokes it via
      # 'check', but a failure anywhere else in the build would hide the report.
      # This is the step that answers "which mixins will crash the game" without
      # having to launch the game once per mistake.
      - name: Validate mixin injection descriptors
        id: mixincheck
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew validateMixinDescriptors --no-daemon --stacktrace 2>&1 | tee mixin-check.log

      - name: Summarise compile errors
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p build-logs
          grep -n 'error:' build.log > build-logs/errors.txt 2>/dev/null || true
          echo "distinct error lines:" >> build-logs/errors.txt
          grep -c 'error:' build.log >> build-logs/errors.txt 2>/dev/null || true
          # Mod-side remap warnings are ours to fix. Anything naming a Fabric API
          # or Sodium class belongs to a dependency and is noise for this port.
          grep -n 'Cannot remap' build.log > build-logs/remap-warnings-all.txt 2>/dev/null || true
          grep -v -E 'net/fabricmc|fabric-api' build-logs/remap-warnings-all.txt \
            > build-logs/remap-warnings.txt 2>/dev/null || true
          grep -n 'Zemlya library found\|no libs/zemlya' build.log > build-logs/zemlya-status.txt 2>/dev/null || true
          grep -n 'SHA library found\|SHA jar not found' build.log > build-logs/sha-status.txt 2>/dev/null || true

      - name: Collect the mixin descriptor report
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p build-logs
          cp -f mixin-check.log build-logs/mixin-check.log 2>/dev/null || true
          REPORT=build/reports/mixin-check/report.txt
          if [ -f "$REPORT" ]; then
            cp -f "$REPORT" build-logs/mixin-check.txt
            ERRS=$(grep -c '^ERROR' "$REPORT" 2>/dev/null || echo 0)
            WARNS=$(grep -c '^WARN' "$REPORT" 2>/dev/null || echo 0)
            echo "mixin check: $ERRS error(s), $WARNS warning(s)"
            {
              echo "### Mixin descriptor check"
              echo ""
              echo "- errors: $ERRS"
              echo "- warnings: $WARNS"
              echo ""
              echo '```'
              grep '^ERROR' "$REPORT" | head -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$ERRS" -gt 0 ]; then
              echo "::warning::mixin descriptor check found $ERRS injector(s) that will crash the game - see build-logs/mixin-check.txt"
            fi
          else
            echo "::warning::no mixin descriptor report was produced - the validator did not run"
          fi

      - name: Dump real 1.21.11 API signatures
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p build-logs
          OUT=build-logs/api-dump.txt
          : > "$OUT"
          # Keep this list SMALL. Searching the whole Gradle cache takes hours.
          JARS=$(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | head -100)
          FABRIC_JARS=$(find ~/.gradle/caches/modules-2 -path '*fabric*' -name '*.jar' 2>/dev/null | head -200)
          ALL_JARS="$JARS $FABRIC_JARS"
          echo "searching $(echo $ALL_JARS | wc -w) jars" >> "$OUT"
          # Round 8. The lightmap classes are here because the mod overrides the
          # VANILLA lightmap.fsh and has to feed it through these objects. Field
          # ORDER inside the render state mirrors the shader's std140 block, and a
          # single inserted field silently blacks out the world, so the exact
          # member list has to be read rather than guessed.
          CLASSES='net.minecraft.client.renderer.LevelRenderer net.minecraft.client.Camera net.minecraft.client.renderer.LightTexture net.minecraft.client.renderer.state.LightmapRenderState net.minecraft.client.renderer.state.LightmapRenderStateExtractor net.minecraft.world.attribute.EnvironmentAttributes net.minecraft.world.attribute.EnvironmentAttributeProbe net.minecraft.world.attribute.EnvironmentAttributeMap net.minecraft.world.level.dimension.DimensionType'
          for C in $CLASSES; do
            P=$(echo "$C" | tr '.' '/').class
            FOUND=""
            for J in $ALL_JARS; do
              # intermediary jars carry class_1234 / field_5678 names, which are
              # useless as a porting reference - always prefer a mapped jar
              case "$J" in *intermediary*) continue;; esac
              if unzip -l "$J" 2>/dev/null | grep -q "$P"; then
                FOUND="$J"
                break
              fi
            done
            echo "" >> "$OUT"
            echo "========== $C ==========" >> "$OUT"
            if [ -z "$FOUND" ]; then
              echo "class not present in the searched non-intermediary jars" >> "$OUT"
            else
              echo "# from: $FOUND" >> "$OUT"
              javap -p -cp "$FOUND" "$C" >> "$OUT" 2>&1
            fi
          done
          # Some of the classes above move between packages across versions. If a
          # lookup above failed, locate it by simple name so the real fully
          # qualified name shows up instead of a dead end.
          MC_JAR=""
          for J in $ALL_JARS; do
            case "$J" in *intermediary*) continue;; esac
            if unzip -l "$J" 2>/dev/null | grep -q 'net/minecraft/client/renderer/LevelRenderer.class'; then
              MC_JAR="$J"
              break
            fi
          done
          if [ -n "$MC_JAR" ]; then
            echo "" >> "$OUT"
            echo "########## classes matching Lightmap / LightTexture / EnvironmentAttribute ##########" >> "$OUT"
            echo "# jar: $MC_JAR" >> "$OUT"
            unzip -l "$MC_JAR" 2>/dev/null | awk '{print $4}' \
              | grep -E 'Lightmap|LightTexture|EnvironmentAttribute' \
              | grep '\.class$' >> "$OUT" || true
          fi
          # ---- mod classes: Sodium (0.8.12+) and Punchy (libs/punchy.jar) ----
          # Mod names are never obfuscated, so a "Cannot remap" here means the
          # method genuinely does not exist under that name in these versions.
          MOD_JARS="$(find ~/.gradle/caches/modules-2 ~/.gradle/caches/fabric-loom -iname '*sodium*.jar' 2>/dev/null | head -40) $(ls libs/*.jar 2>/dev/null)"
          echo "" >> "$OUT"
          echo "########## MOD JARS ##########" >> "$OUT"
          for J in $MOD_JARS; do echo "$J" >> "$OUT"; done
          MOD_CLASSES='net.caffeinemc.mods.sodium.client.world.LevelSlice punchy.client.render.ToolKindResolver punchy.client.renderer.layer.VanillaFirstPersonItemLayer punchy.client.renderer.layer.PlayerArmModelLayer'
          for C in $MOD_CLASSES; do
            P=$(echo "$C" | tr '.' '/').class
            FOUND=""
            for J in $MOD_JARS; do
              if unzip -l "$J" 2>/dev/null | grep -q "$P"; then
                FOUND="$J"
                break
              fi
            done
            echo "" >> "$OUT"
            echo "========== $C ==========" >> "$OUT"
            if [ -z "$FOUND" ]; then
              echo "class not present in the mod jars listed above" >> "$OUT"
            else
              echo "# from: $FOUND" >> "$OUT"
              javap -p -cp "$FOUND" "$C" >> "$OUT" 2>&1
            fi
          done
          # Where did ambient occlusion move to inside Sodium? Dump every Sodium
          # class whose signatures still mention it, so the injector can target
          # the real owner instead of a guessed name. No head limit: the previous
          # cap of 400 classes cut the scan off before it printed a single hit.
          SODIUM_JAR=$(echo $MOD_JARS | tr ' ' '\n' | grep -i sodium | head -1)
          if [ -n "$SODIUM_JAR" ]; then
            echo "" >> "$OUT"
            echo "########## sodium classes mentioning AmbientOcclusion ##########" >> "$OUT"
            echo "# jar: $SODIUM_JAR" >> "$OUT"
            for CL in $(unzip -l "$SODIUM_JAR" 2>/dev/null | awk '{print $4}' | grep '^net/caffeinemc/.*\.class$' | grep -viE '\$[0-9]+\.class$'); do
              CN=$(echo "${CL%.class}" | tr '/' '.')
              if javap -p -cp "$SODIUM_JAR" "$CN" 2>/dev/null | grep -iq 'ambientocclusion'; then
                echo "" >> "$OUT"
                echo "===== $CN =====" >> "$OUT"
                javap -p -cp "$SODIUM_JAR" "$CN" 2>&1 | grep -i 'class \|ambientocclusion' >> "$OUT"
              fi
            done
          fi
          # NOTE: never sort this file. The sections above are only readable in
          # the order they were written, and record field order is the whole
          # point of this step.
          echo "api dump complete"

      - name: Collect logs and reports
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p build-logs
          cp -f build.log build-logs/build.log 2>/dev/null || true
          cp -rf build/reports build-logs/reports 2>/dev/null || true
          echo "build outcome: ${{ steps.build.outcome }}" > build-logs/outcome.txt
          echo "mixin check outcome: ${{ steps.mixincheck.outcome }}" >> build-logs/outcome.txt
          ls -R build-logs || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mod jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nostalgia-jars
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed - download the 'build-log' artifact for the full log"
          exit 1
