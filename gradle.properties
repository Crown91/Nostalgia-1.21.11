# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# NOTE: org.gradle.java.home was a hardcoded Windows path and has been removed.
# 1.21.11 builds with JDK 21. If your default JDK is not 21, uncomment and fix:
# org.gradle.java.home=C:\\path\\to\\jdk-21

# Fabric Properties - check exact values on https://fabricmc.net/develop/
minecraft_version=1.21.11
loader_version=0.17.2
loom_version=1.15.4

# Mod Properties
mod_version=1.0.0
maven_group=net.nostalgia
archives_base_name=alpha_protocol

# Dependencies
# TODO verify on fabricmc.net/develop for 1.21.11
fabric_version=0.135.0+1.21.11

# Sodium build for 1.21.11 (Modrinth version id, verify on modrinth.com/mod/sodium/versions)
sodium_version=mc1.21.11-0.8.7-fabric

# SHA jar built from the ported SHA-1.21.11 project. Drop it into ./libs/
sha_jar=libs/sha-1.0.7.jar

# IMPORTANT: 1.21.11 is obfuscated, unlike 26.1.x.
# fabric.loom.disableObfuscation must NOT be set here.
